name: smoke

# Temporary foundation check (workflow_dispatch only):
#  - brew / xcodegen / xcodebuild / zip / PlistBuddy / upload-artifact が runner で通るか
#  - XcodeGen の `type: folder` が Resources/tags と Resources/astryx を
#    バンドル内でディレクトリ構造のままコピーするか
# 実プロジェクトのコンパイルに依存せず、基盤だけを切り分けるための使い捨て。
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen && xcodegen --version

      - name: Scaffold a minimal SwiftUI app with folder references
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/smoke"
          mkdir -p "$WORK/Sources" \
                   "$WORK/Resources/Assets.xcassets/AppIcon.appiconset" \
                   "$WORK/Resources/tags" \
                   "$WORK/Resources/astryx"
          cat > "$WORK/project.yml" <<'YML'
          name: Smoke
          options:
            bundleIdPrefix: dev.inugami
            deploymentTarget:
              iOS: "16.0"
          settings:
            base:
              SWIFT_VERSION: "5.0"
              CODE_SIGN_STYLE: Manual
              CODE_SIGNING_ALLOWED: NO
              CODE_SIGNING_REQUIRED: NO
              ENABLE_BITCODE: NO
              ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          targets:
            Smoke:
              type: application
              platform: iOS
              sources:
                - path: Sources
                - path: Resources
                  excludes:
                    - "Info.plist"
                    - "tags"
                    - "astryx"
                - path: Resources/tags
                  type: folder
                - path: Resources/astryx
                  type: folder
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: dev.inugami.smoke
                  INFOPLIST_FILE: Resources/Info.plist
                  GENERATE_INFOPLIST_FILE: NO
          schemes:
            Smoke:
              build:
                targets:
                  Smoke: all
          YML
          cat > "$WORK/Sources/SmokeApp.swift" <<'SWIFT'
          import SwiftUI

          @main
          struct SmokeApp: App {
              var body: some Scene {
                  WindowGroup { Text("smoke") }
              }
          }
          SWIFT
          cat > "$WORK/Resources/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>1.0.0</string>
              <key>CFBundleVersion</key><string>1</string>
              <key>MinimumOSVersion</key><string>16.0</string>
              <key>UILaunchScreen</key><dict/>
          </dict>
          </plist>
          PLIST
          echo '{ "info": { "author": "xcode", "version": 1 } }' \
            > "$WORK/Resources/Assets.xcassets/Contents.json"
          echo '{
            "images" : [
              {
                "filename" : "AppIcon-1024.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }' > "$WORK/Resources/Assets.xcassets/AppIcon.appiconset/Contents.json"
          # 1x1 PNG -> 1024x1024 so actool has something real to compile
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==' \
            | base64 -d > "$WORK/icon.png"
          sips -z 1024 1024 "$WORK/icon.png" \
            --out "$WORK/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png" >/dev/null
          echo '{"es": {"tag": "test"}}' > "$WORK/Resources/tags/es.json"
          echo '<!doctype html><title>astryx</title>' > "$WORK/Resources/astryx/pupil-astryx.html"
          echo '/* css */' > "$WORK/Resources/astryx/astryx.css"
          echo '// js' > "$WORK/Resources/astryx/astryx.js"
          cd "$WORK"
          xcodegen generate --spec project.yml
          grep -n "tags\|astryx" Smoke.xcodeproj/project.pbxproj | head -20

      - name: Build + package + verify bundle layout
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/smoke"
          xcodebuild -project Smoke.xcodeproj -scheme Smoke -sdk iphoneos \
            -configuration Release -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log | grep -E "error:|Copying|BUILD" | tail -n 40
          APP="build/Build/Products/Release-iphoneos/Smoke.app"
          test -d "$APP"
          echo "--- bundle tree ---"
          find "$APP" -maxdepth 2 | sort
          echo "--- folder reference assertions ---"
          test -f "$APP/tags/es.json"             && echo "OK tags/es.json"
          test -f "$APP/astryx/pupil-astryx.html" && echo "OK astryx/pupil-astryx.html"
          test -f "$APP/astryx/astryx.js"         && echo "OK astryx/astryx.js"
          test -f "$APP/astryx/astryx.css"        && echo "OK astryx/astryx.css"
          test -f "$APP/Assets.car"               && echo "OK Assets.car"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Smoke-unsigned.ipa Payload
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          unzip -l Smoke-unsigned.ipa | head -30
          ls -lh Smoke-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-ipa
          path: ${{ runner.temp }}/smoke/Smoke-unsigned.ipa
          if-no-files-found: error
